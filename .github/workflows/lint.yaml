name: Lint
on:
  push:
    paths:
      - "**.go"
      - go.mod
      - go.sum
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
      - name: Vulnerability scan
        # Blocking: the tree has no reachable advisories as of this commit
        # (see plan 018 and the GO-2026-5320 goldmark fix). A future PR that
        # introduces one should fail here rather than ship silently.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
