name: Test
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Validate the wire vector corpus
        run: make vectors
      - name: Run unit tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
      - name: Coverage floor
        # Measured 71.0% on the tree that added this check (plan 018); the
        # floor sits two points under that as slack for normal fluctuation,
        # not as an aspirational target. Raise it as coverage genuinely
        # improves, never lower it to make a red run pass.
        env:
          COVERAGE_FLOOR: "69.0"
        run: |
          coverage=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "measured coverage: ${coverage}% (floor: ${COVERAGE_FLOOR}%)"
          awk -v cov="$coverage" -v floor="$COVERAGE_FLOOR" \
            'BEGIN { if (cov + 0 < floor + 0) { exit 1 } }' \
            || { echo "coverage ${coverage}% is below the ${COVERAGE_FLOOR}% floor"; exit 1; }
