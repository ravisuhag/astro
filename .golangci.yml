version: "2"

issues:
  # golangci-lint truncates to 3 issues of the same kind and 50 per linter by
  # default. That silent truncation has twice hidden real findings here — 66
  # of 76 errorlint issues in one change, 450 errcheck issues in another —
  # both on sweeping edits where full output mattered most. Report everything.
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  enable:
    # Flags direct == / != / switch comparisons against sentinel errors, and
    # %v or %s used to format an error where %w would let a caller unwrap
    # it. Fixed under plan 018 for pkg/xtce and cli/stream.go, under plan
    # 023 for internal/ndm, and as follow-up to plan 018 across every test
    # file in the repo (no exclusions remain).
    - errorlint
