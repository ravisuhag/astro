version: "2"

linters:
  enable:
    # Flags direct == / != / switch comparisons against sentinel errors, and
    # %v or %s used to format an error where %w would let a caller unwrap
    # it. Fixed under plan 018 for pkg/xtce and cli/stream.go; see the
    # exclusion rules below for what plan 018 found but deliberately left
    # for a follow-up (out of scope for that plan's file list).
    - errorlint

  exclusions:
    rules:
      # Tests intentionally compare errors they construct directly against
      # a sentinel, which is precise and does not need errors.Is.
      # Pre-existing across many packages (pkg/aos, pkg/tcf, pkg/usdl, and
      # more); not part of plan 018's scope.
      - path: _test\.go
        linters:
          - errorlint
      # internal/ndm has the same err == io.EOF pattern pkg/xtce did
      # (combined.go:135, xml.go:415/440/487), a real defect of the same
      # shape, but internal/ndm was not in plan 018's file list. Left as
      # follow-up debt; see plan 018's execution report.
      - path: internal/ndm/(combined|xml)\.go
        linters:
          - errorlint
